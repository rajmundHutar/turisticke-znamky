services:
  app:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
    volumes:
      - .:/usr/src
    image: tz-app
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - ENVIRONMENT=dev
      - HOME=/tmp
      - COMPOSER_HOME=/tmp/composer
    ports:
      - 8082:8080
  db:
    build:
      context: .
      dockerfile: ./.docker/db/Dockerfile
    image: tz-db
    restart: always
    ports:
      - 13306:3306
